{# Respuesta tras borrar con éxito: el producto ya no está en la lista.

   desaparece de la tabla y el usuario ve qué ocurrió. #}

    <tr>
        <td colspan="5">
            <div class="aviso-exito">Producto eliminado correctamente.</div>
        </td>
    </tr>
</tbody>
